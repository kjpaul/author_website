<text x="800" y="96" font-size="23" text-anchor="start" font-weight="normal" fill="#111">Mass driver (LSM) track</text>
<text x="800" y="122" font-size="23" text-anchor="start" font-weight="normal" fill="#111">on top of the casing</text>
<line x1="668.75" y1="238.75" x2="792" y2="238.75" stroke="#222" stroke-width="2"/>
<text x="800" y="262" font-size="23" text-anchor="start" font-weight="normal" fill="#111">Lift compensation tracks</text>
<text x="800" y="288" font-size="23" text-anchor="start" font-weight="normal" fill="#111">(EMS coils)</text>
<line x1="668.75" y1="268.75" x2="792" y2="336" stroke="#222" stroke-width="2"/>
<text x="800" y="330" font-size="23" text-anchor="start" font-weight="normal" fill="#111">Ferromagnetic plates</text>
<text x="800" y="356" font-size="23" text-anchor="start" font-weight="normal" fill="#111">on the cable</text>
<line x1="731.25" y1="406.25" x2="792" y2="404.25" stroke="#222" stroke-width="2"/>
<text x="800" y="404" font-size="23" text-anchor="start" font-weight="normal" fill="#111">LIM stators, with reaction</text>
<text x="800" y="430" font-size="23" text-anchor="start" font-weight="normal" fill="#111">plates on the cable</text>
<line x1="668.75" y1="573.75" x2="792" y2="571.75" stroke="#222" stroke-width="2"/>
<text x="800" y="573.75" font-size="23" text-anchor="start" font-weight="normal" fill="#111">Casing support tracks</text>
<text x="800" y="599.75" font-size="23" text-anchor="start" font-weight="normal" fill="#111">(EMS coils)</text>
<text x="800" y="635.75" font-size="21" text-anchor="start" font-weight="normal" fill="#444">about 100 mm gap between</text>
<text x="800" y="659.75" font-size="21" text-anchor="start" font-weight="normal" fill="#444">coil and plate</text>
<line x1="325" y1="437.5" x2="300" y2="437.5" stroke="#222" stroke-width="2"/>
<text x="292" y="429.5" font-size="23" text-anchor="end" font-weight="normal" fill="#111">Casing, about 9 to 11 m</text>
<text x="292" y="455.5" font-size="23" text-anchor="end" font-weight="normal" fill="#111">on a side</text>
<text x="292" y="505.5" font-size="21" text-anchor="end" font-weight="normal" fill="#444">The cable moves away</text>
<text x="292" y="531.5" font-size="21" text-anchor="end" font-weight="normal" fill="#444">from the viewer at</text>
<text x="292" y="557.5" font-size="21" text-anchor="end" font-weight="normal" fill="#444">8,786 m/s relative to</text>
<text x="292" y="583.5" font-size="21" text-anchor="end" font-weight="normal" fill="#444">the casing, which holds</text>
<text x="292" y="609.5" font-size="21" text-anchor="end" font-weight="normal" fill="#444">still over the ground.</text>
<text x="550" y="1029" font-size="21" text-anchor="middle" font-weight="normal" fill="#445566">Shielded from above by the cable</text>
<line x1="331.25" y1="677.5" x2="230" y2="1010" stroke="#222" stroke-width="3" stroke-dasharray="12,8" marker-end="url(#ar)"/>
<line x1="768.75" y1="677.5" x2="870" y2="1010" stroke="#222" stroke-width="3" stroke-dasharray="12,8" marker-end="url(#ar)"/>
<text x="345" y="1042" font-size="22" text-anchor="end" font-weight="normal" fill="#111">Anchor lines and spreader arms</text>
<text x="345" y="1068" font-size="22" text-anchor="end" font-weight="normal" fill="#111">to the ground, 700 km below</text>
<text x="790" y="1042" font-size="22" text-anchor="start" font-weight="normal" fill="#111">Spreader arms hold the</text>
<text x="790" y="1068" font-size="22" text-anchor="start" font-weight="normal" fill="#111">suspended solar array</text>
<text x="790" y="1094" font-size="22" text-anchor="start" font-weight="normal" fill="#111">open 100 km below</text>
<text x="550" y="1118" font-size="19" text-anchor="middle" font-weight="normal" fill="#444">Not to scale. Dimensions from Chapters 3, 8, and 16.</text>
</svg>