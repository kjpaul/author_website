<text x="800" y="632" font-size="19" text-anchor="middle" font-weight="normal" fill="#111">equipment bay (bottom-heavy)</text>
<text x="800" y="226" font-size="19" text-anchor="middle" font-weight="normal" fill="#111">sled</text>
<text x="800" y="438" font-size="22" text-anchor="middle" font-weight="bold" fill="#ffffff">CNT cable</text>
<text x="800" y="466" font-size="19" text-anchor="middle" font-weight="normal" fill="#ffffff">7.39 m square</text>
<text x="800" y="752" font-size="19" text-anchor="middle" font-weight="normal" fill="#111">Quarters and offices</text>
<text x="800" y="778" font-size="19" text-anchor="middle" font-weight="normal" fill="#111">in the cable's shadow</text>
<text x="800" y="876" font-size="19" text-anchor="middle" font-weight="normal" fill="#111">Factories, depots</text>
