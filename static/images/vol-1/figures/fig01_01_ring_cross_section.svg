<text x="800" y="876" font-size="19" text-anchor="middle" font-weight="normal" fill="#111">Factories, depots</text>
<text x="800" y="940" font-size="18" text-anchor="middle" font-weight="normal" fill="#445566">Shielded from above by the cable</text>
<line x1="625" y1="662" x2="520" y2="1060" stroke="#222" stroke-width="3" stroke-dasharray="12,8" marker-end="url(#ar)"/>
<line x1="975" y1="662" x2="1080" y2="1060" stroke="#222" stroke-width="3" stroke-dasharray="12,8" marker-end="url(#ar)"/>
<text x="470" y="1000" font-size="19" text-anchor="end" font-weight="normal" fill="#111">Anchor lines and spreader arms</text>
<text x="470" y="1026" font-size="19" text-anchor="end" font-weight="normal" fill="#111">to the ground, 700 km below</text>
<text x="1130" y="1000" font-size="19" text-anchor="start" font-weight="normal" fill="#111">Spreader arms hold the suspended</text>
<text x="1130" y="1026" font-size="19" text-anchor="start" font-weight="normal" fill="#111">solar array open 100 km below</text>
<text x="800" y="1110" font-size="18" text-anchor="middle" font-weight="normal" fill="#444">Not to scale. Dimensions from Chapters 3, 8, and 16.</text>
