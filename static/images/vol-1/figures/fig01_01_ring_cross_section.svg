<text x="1090" y="476" font-size="20" text-anchor="start" font-weight="normal" fill="#111">Casing support tracks (EMS coils)</text>
<text x="1090" y="506" font-size="18" text-anchor="start" font-weight="normal" fill="#444">about 100 mm gap between coil and plate</text>
<line x1="620" y1="470" x2="520" y2="470" stroke="#222" stroke-width="2"/>
<text x="510" y="455" font-size="20" text-anchor="end" font-weight="normal" fill="#111">Casing, about 9 to 11 m</text>
<text x="510" y="482" font-size="20" text-anchor="end" font-weight="normal" fill="#111">on a side</text>
<text x="510" y="540" font-size="18" text-anchor="end" font-weight="normal" fill="#444">The cable moves away from the</text>
<text x="510" y="564" font-size="18" text-anchor="end" font-weight="normal" fill="#444">viewer at 8,786 m/s relative</text>
<text x="510" y="588" font-size="18" text-anchor="end" font-weight="normal" fill="#444">to the casing, which holds still</text>
<text x="510" y="612" font-size="18" text-anchor="end" font-weight="normal" fill="#444">over the ground.</text>
